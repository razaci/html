<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAZACI HTML Launcher</title>
<style>
:root{--bg:#030706;--panel:#09110e;--panel2:#0d1712;--line:#1e5235;--line2:#43c978;--text:#eafff1;--muted:#7fa18b;--glow:#71ff9f}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:
radial-gradient(circle at 50% -15%,#123523 0,transparent 35%),
linear-gradient(180deg,#040a07,#020403 70%);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(rgba(110,255,158,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(110,255,158,.06) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,#000,transparent 75%)}
header{position:sticky;top:0;z-index:10;background:rgba(4,10,7,.86);backdrop-filter:blur(18px);border-bottom:1px solid rgba(91,255,143,.22);box-shadow:0 10px 35px #0008;padding:14px 0}
.wrap{max-width:1180px;margin:auto;padding-left:16px;padding-right:16px}
h1{font-size:clamp(18px,4vw,25px);letter-spacing:.09em;margin:0;color:#caffd8;text-shadow:0 0 18px #48ff7c55}
h1:before{content:"◈";color:var(--glow);margin-right:9px}.sub{color:#72967e;font-size:12px;margin:5px 0 12px;letter-spacing:.06em}
.controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
input,button{min-height:44px;padding:10px 13px;border:1px solid #285f3e;border-radius:10px;background:linear-gradient(180deg,#101b15,#09110d);color:var(--text);font:inherit;outline:none;transition:.18s ease}
input:focus{border-color:#59dc84;box-shadow:0 0 0 3px #45ff7b18,0 0 25px #32ff6c12}
button{cursor:pointer;font-weight:800;letter-spacing:.03em}button:hover{border-color:#5ef48c;transform:translateY(-1px);box-shadow:0 5px 20px #35ff7018}
#count{padding:16px 2px 10px;color:#79a488;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:11px;padding-bottom:42px}
.card{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(14,25,19,.96),rgba(5,10,7,.96));border:1px solid #1d4930;border-radius:13px;padding:13px;box-shadow:0 10px 30px #0004;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}
.card:before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:linear-gradient(transparent,#52e981,transparent);opacity:.5}
.card:hover{transform:translateY(-3px);border-color:#3a9a5e;box-shadow:0 14px 35px #0008,0 0 24px #42ff7610}
.name{font-weight:850;overflow-wrap:anywhere;margin:2px 0 12px;min-height:38px;display:flex;align-items:center;line-height:1.15}
.name:before{content:"▣";font-size:11px;color:#61f38d;margin-right:8px;filter:drop-shadow(0 0 6px #4cff7b)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
a{display:flex;align-items:center;justify-content:center;text-decoration:none;text-align:center;min-height:38px;padding:8px;border:1px solid #28553a;border-radius:8px;color:#ccebd5;background:#0b1510;font-size:12px;font-weight:750;transition:.16s ease}
a:hover{background:#11261a;border-color:#50d87c;color:white}.play{grid-column:1/-1;background:linear-gradient(90deg,#10301c,#174628,#10301c);border-color:#3d9c5e;color:#aaffc1;letter-spacing:.03em}
.play:hover{background:linear-gradient(90deg,#174b29,#1c5d32,#174b29);box-shadow:0 0 18px #43ff7722}
#help{display:none;position:fixed;inset:0;z-index:20;background:#000b;backdrop-filter:blur(8px);place-items:center;padding:20px}.box{width:min(480px,95vw);background:linear-gradient(145deg,#101d16,#070c09);border:1px solid #3b8055;border-radius:14px;padding:20px;line-height:1.6;box-shadow:0 25px 80px #000,0 0 35px #46ff7818}.box b{color:#8dffae}
@media(max-width:600px){header{padding:10px 0}.wrap{padding-left:10px;padding-right:10px}.controls{grid-template-columns:1fr}#grid{grid-template-columns:1fr;gap:8px}.card{padding:11px}.name{min-height:auto;margin-bottom:10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head>
<body>
<header><div class="wrap"><h1>RAZACI // PROJECT NEXUS</h1>
<div class="sub">LOCAL PROJECT INDEX · 100 REPOSITORIES · ZERO API BOOT DEPENDENCY</div>
<div class="controls"><input id="q" placeholder="Search projects…"><button id="save">＋ SAVE LAUNCHER</button></div></div></header>
<main class="wrap"><div id="count"></div><div id="grid"></div></main>
<div id="help"><div class="box"><b>📲 Save this launcher</b><div id="helpText"></div><button id="close">CLOSE</button></div></div>
<script>
const USER="razaci";
const PROJECTS=["herbalheart", "vet-assist", "fluttergpt", "the-wise-ml-example", "localGPT", "Simple-IP-Config", "JARVIS2", "atlas", "easydiffusion", "vespper", "cascadepaws", "towerdefense", "jarvisofthegods", "cookinggods", "midjourney-ui", "gpt4all", "season-pass-extension", "scratch", "Build_a_Webcam_Monitoring_Email_Alert_App_Using_Python", "ai-assistant", "anything-llm", "timeline", "lunar", "PWMLEDs", "GPT_AUTOMATE", "cargods", "vessel", "web-ui", "hippocampusgods", "escapegods", "cakechat", "smart-sec-cam", "pos", "dalai", "master-crewai-course", "J.A.R.V.I.S", "vetgod", "vetanatomy", "html", "understanding_ai", "crewAI", "sagify", "CONQUESTGODS", "autotrain-advanced", "Portable-The-Most-Dangerous-Writing-App", "kitchenofthegods", "vetclinic", "JARVIS", "gpt4-pdf-chatbot-langchain", "razaci.github.io", "RC-OS", "themostdangerouswritingapp", "livekit", "vetfighter", "cavegods", "empiregods", "morphhound", "ng-video-lecture", "koboldcpp", "ashenawake", "chatgpt-ui", "ComfyUI", "space", "herbcare", "rc-joystick", "open-operator", "mobilecommand", "llama", "spiritgods", "mindforge", "battleship", "Open-Assistant", "agents", "Alpaca-Turbo", "n8n", "JARVIS-AI-ASSISTANT", "AnimateDiff", "jetgods", "islandwatch", "Auto-GPT", "midjourney-discord-wrapper", "Autonomous-Self-Driving-Car-GTA-5", "Fooocus", "RVC3-python", "barkside", "Auto-GPT-Crypto-Plugin", "SuperAGI", "liora", "spacegods", "langchain", "jan", "zoogods", "spunggods", "sharkgods", "personaGPT", "chatgpt-api-by-browser-script", "the-afterlife-as-we-knew-it", "self-operating-computer", "morphgods", "gutenberg"];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function site(name){return name==="razaci.github.io"?"https://razaci.github.io/":`https://${USER}.github.io/${encodeURIComponent(name)}/`}
function draw(){
 let q=$("#q").value.trim().toLowerCase();
 let list=PROJECTS.filter(n=>n.toLowerCase().includes(q)).sort((a,b)=>a.localeCompare(b));
 $("#count").textContent=`${list.length} of ${PROJECTS.length} projects`;
 $("#grid").innerHTML=list.map(n=>`<div class="card"><div class="name">${esc(n)}</div><div class="actions">
 <a href="https://github.com/${USER}/${encodeURIComponent(n)}" target="_blank" rel="noopener">⌘ REPO</a>
 <a href="${site(n)}" target="_blank" rel="noopener">◇ SITE</a>
 <a class="play" href="${site(n)}" target="_blank" rel="noopener">▶ LAUNCH PROJECT</a>
 </div></div>`).join("");
}
$("#q").oninput=draw;
$("#save").onclick=()=>{
 let ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||((navigator.platform==="MacIntel")&&navigator.maxTouchPoints>1);
 $("#helpText").innerHTML=ios?"<p>On iPhone/iPad in Safari: tap <b>Share</b> → <b>Add to Home Screen</b> → <b>Add</b>.</p>":"<p>On Windows press <b>Ctrl + D</b> to bookmark this page. On Mac press <b>⌘ + D</b>.</p>";
 $("#help").style.display="grid";
};
$("#close").onclick=()=>$("#help").style.display="none";
$("#help").onclick=e=>{if(e.target===$("#help"))$("#help").style.display="none"};
draw();
</script></body></html>
