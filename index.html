<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAZACI HTML Launcher</title>
<style>
:root{--green:#72ffa0;--line:#245b3a;--text:#eafff1;--muted:#789482}
*{box-sizing:border-box}html,body{min-height:100%}body{margin:0;background:#020604;color:var(--text);font-family:Consolas,"Courier New",monospace;overflow-x:hidden}

.card{width:92px;height:201px;border:1px solid transparent;border-radius:10px;padding:7px 4px 4px;text-align:center;cursor:default;transition:.16s ease;position:relative}.card:before{content:"";position:absolute;inset:0;border-radius:10px;opacity:0;background:linear-gradient(145deg,#65ff9218,transparent 55%);transition:.16s}.card:hover,.card.selected{background:linear-gradient(145deg,#173d2777,#07120c88);border-color:#3e8b59;box-shadow:inset 0 0 18px #5cff8610,0 7px 20px #0006}.card:hover:before,.card.selected:before{opacity:1}

@keyframes scan{0%{transform:translateY(-100vh)}100%{transform:translateY(100vh)}}

@media(prefers-reduced-motion:reduce){body:after{display:none}}

.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function site(name){return name==="razaci.github.io"?"https://razaci.github.io/":`https://${USER}.github.io/${encodeURIComponent(name)}/`}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function fresh(url){
  const sep=url.includes("?")?"&":"?";
  return url+sep+"_reload="+Date.now();
}
function toast(msg){
  const el=$("#toast"); el.textContent=msg; el.classList.add("show");
  clearTimeout(window.__toastTimer); window.__toastTimer=setTimeout(()=>el.classList.remove("show"),1800);
}
async function copyText(text,label){
  try{await navigator.clipboard.writeText(text);toast(label+" copied");}
  catch(e){
    const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");toast(label+" copied");}catch(_){toast("Copy unavailable");}
    ta.remove();
  }
}
function draw(){
 let q=$("#q").value.trim().toLowerCase();
 let list=PROJECTS.filter(n=>n.toLowerCase().includes(q));
 const order=$("#sort").value;
 list.sort((a,b)=>order==="az"?a.localeCompare(b):order==="oldest"?Date.parse(CREATED[a])-Date.parse(CREATED[b]):Date.parse(CREATED[b])-Date.parse(CREATED[a]));
 const label={newest:"NEWEST CREATED FIRST",oldest:"OLDEST CREATED FIRST",az:"A–Z"}[order];
 $("#count").textContent=`NEXUS GRID // ${label} // ${list.length} OF ${PROJECTS.length} PROJECT FOLDERS`;
 const glyphs=["◆","✦","⬢","◈","✧","⌁","✺","✹","◇","⬡"];
 $("#grid").innerHTML=list.map(n=>{
   let h=hash(n), hue=90+(h%120), tilt=((h>>8)%7)-3, glyph=glyphs[(h>>16)%glyphs.length];
   let u=site(n), repo=`https://github.com/${USER}/${encodeURIComponent(n)}`;
   let zip=`https://github.com/${USER}/${encodeURIComponent(n)}/archive/refs/heads/main.zip`;
   return `<div class="card" data-name="${esc(n)}" tabindex="0">
     <div class="folder" style="--h:${hue};--tilt:${tilt}deg;--glyph:'${glyph}'"></div>
     <div class="name">${esc(n)}</div>
     <div class="created" title="Repository creation date">Created ${new Date(CREATED[n]).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"})}</div>
     <div class="actions">
       <a href="${u}" target="_blank" rel="noopener">SITE</a>
       <a href="${repo}" target="_blank" rel="noopener">GITHUB</a>
       <a class="play" href="${u}" target="_blank" rel="noopener">▶ PLAY</a>
       <a href="${repo}/tree/main" target="_blank" rel="noopener">FILES</a>
       <button class="reload" data-reload="${u}">↻ FRESH</button>
       <button data-copy="${u}">COPY SITE</button>
       <button data-copy="${repo}">COPY REPO</button>
       <a class="zip wide" href="${zip}" target="_blank" rel="noopener">⇩ ZIP (MAIN)</a>
     </div>
   </div>`;
 }).join("");

   card.onclick=e=>{
     if(e.target.closest("a,button")) return;
     document.querySelectorAll(".card.selected").forEach(x=>x.classList.remove("selected"));
     card.classList.add("selected");
   };
   card.ondblclick=e=>{if(!e.target.closest("a,button"))window.open(u,"_blank","noopener")};
   card.onkeydown=e=>{if(e.key==="Enter")window.open(u,"_blank","noopener")};
 });
 document.querySelectorAll("[data-reload]").forEach(b=>b.onclick=()=>window.open(fresh(b.dataset.reload),"_blank","noopener"));
 document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copyText(b.dataset.copy,b.textContent.includes("REPO")?"Repo URL":"Site URL"));
}
$("#q").oninput=draw;

};

draw();
