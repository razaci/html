<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RAZACI Project OS — Phase 1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#020706;color:#dfffea;font-family:ui-monospace,monospace}header{position:sticky;top:0;background:#03100ddf;backdrop-filter:blur(10px);padding:15px;border-bottom:1px solid #185f3b;z-index:5}.wrap{max-width:1100px;margin:auto;padding:0 12px}h1{margin:0;color:#64ff98;font-size:clamp(21px,5vw,34px)}small,.muted{color:#6ba982}.controls{display:flex;gap:8px;margin-top:12px}input,button,a.btn{background:#06140f;color:#dfffea;border:1px solid #287a50;border-radius:9px;padding:10px;font:inherit}input{flex:1}button,a{cursor:pointer}.status{padding:15px 0;color:#86c99c}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.card{border:1px solid #1e6040;border-radius:14px;padding:15px;background:linear-gradient(145deg,#091712,#040907)}.folder{font-size:30px}.name{font-weight:900;font-size:18px;margin:5px 0;overflow-wrap:anywhere}.desc{height:38px;font-size:12px;color:#79a88a;overflow:hidden}.badge{display:inline-block;margin:10px 0 7px;padding:3px 7px;border:1px solid #287a50;border-radius:99px;color:#65ff9a;font-size:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions a{text-decoration:none;text-align:center;color:#baffcf;border:1px solid #287a50;padding:9px;border-radius:8px;font-size:11px;font-weight:bold}.explorer{display:none;margin:18px 0 50px;border:1px solid #2a8455;border-radius:14px;overflow:hidden}.explorer.on{display:block}.exhead{display:flex;align-items:center;gap:8px;background:#092016;padding:12px}.exhead b{flex:1}.exbody{padding:12px}.path{color:#7fc99a;font-size:12px;margin-bottom:10px;overflow-wrap:anywhere}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.toolbar a,.toolbar button{text-decoration:none;color:#caffd8;background:#07140f;border:1px solid #287a50;border-radius:8px;padding:8px;font:inherit;font-size:11px}.row{display:grid;grid-template-columns:28px 1fr auto;gap:8px;padding:10px;border-bottom:1px solid #123a26;cursor:pointer}.row:hover{background:#0a1e15}.type{font-size:10px;color:#5d9873}@media(max-width:520px){.controls{flex-direction:column}.grid{grid-template-columns:1fr}}</style></head>
<body><header><div class="wrap"><h1>◈ RAZACI // PROJECT OS</h1><small>PHASE 1 · repository explorer + Pages-aware launcher</small><div class="controls"><input id="q" placeholder="Search projects…"><button id="refresh">↻ REFRESH</button></div></div></header>
<main class="wrap"><div id="status" class="status">Connecting to GitHub…</div><section id="grid" class="grid"></section>
<section id="explorer" class="explorer"><div class="exhead"><span>▣</span><b id="title"></b><button id="close">✕</button></div><div class="exbody"><div id="path" class="path"></div><div id="toolbar" class="toolbar"></div><div id="files"></div></div></section></main>
<script>
const USER="razaci", $=s=>document.querySelector(s); let repos=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const site=r=>r.homepage&&/^https?:\/\//i.test(r.homepage)?r.homepage:`https://${USER}.github.io/${encodeURIComponent(r.name)}/`;
async function api(url){let x=await fetch(url,{headers:{Accept:"application/vnd.github+json"}});if(!x.ok)throw Error("GitHub "+x.status);return x.json()}
function render(){let q=$("#q").value.toLowerCase(), list=repos.filter(r=>(r.name+" "+(r.description||"")).toLowerCase().includes(q));$("#grid").innerHTML=list.map(r=>`<article class="card"><div class="folder">📁</div><div class="name">${esc(r.name)}</div><div class="desc">${esc(r.description||"GitHub project")}</div><div class="badge">${r.has_pages?"● GITHUB PAGES":"○ REPOSITORY"}</div><div class="actions">${r.has_pages?`<a href="${esc(site(r))}" target="_blank">▶ PLAY / SITE</a>`:`<a href="${esc(r.html_url)}" target="_blank">↗ GITHUB</a>`}<a href="#" data-repo="${esc(r.name)}" class="browse">▣ EXPLORE</a></div></article>`).join("")||'<div class="status">No matching projects.</div>';document.querySelectorAll(".browse").forEach(a=>a.onclick=e=>{e.preventDefault();explore(a.dataset.repo,"")})}
async function explore(repo,path){let r=repos.find(x=>x.name===repo),ex=$("#explorer");ex.classList.add("on");$("#title").textContent="📁 "+repo;$("#path").textContent="/"+repo+(path?"/"+path:"");$("#files").innerHTML='<div class="status">Reading folder…</div>';let tools=`<a href="${r.html_url}" target="_blank">↗ GITHUB</a>`+(r.has_pages?`<a href="${site(r)}" target="_blank">▶ SITE</a>`:"")+(path?'<button id="up">← UP</button>':"");$("#toolbar").innerHTML=tools;if(path)$("#up").onclick=()=>explore(repo,path.split("/").slice(0,-1).join("/"));ex.scrollIntoView({behavior:"smooth"});try{let url=`https://api.github.com/repos/${USER}/${encodeURIComponent(repo)}/contents/${path.split("/").map(encodeURIComponent).join("/")}`,items=await api(url);if(!Array.isArray(items))items=[items];items.sort((a,b)=>(a.type==="dir"?0:1)-(b.type==="dir"?0:1)||a.name.localeCompare(b.name));$("#files").innerHTML="";items.forEach(f=>{let d=document.createElement("div");d.className="row";let icon=f.type==="dir"?"📁":/\.html?$/i.test(f.name)?"🌐":/\.(png|jpg|jpeg|gif|webp|svg)$/i.test(f.name)?"🖼️":"📄";d.innerHTML=`<span>${icon}</span><span>${esc(f.name)}</span><span class="type">${f.type}</span>`;d.onclick=()=>f.type==="dir"?explore(repo,f.path):window.open(f.html_url,"_blank","noopener");$("#files").appendChild(d)})}catch(e){$("#files").innerHTML=`<div class="status">Unable to read folder: ${esc(e.message)}</div>`}}
async function load(){try{$("#status").textContent="Scanning @"+USER+"…";let all=[];for(let p=1;p<=10;p++){let b=await api(`https://api.github.com/users/${USER}/repos?per_page=100&page=${p}&sort=updated`);all.push(...b);if(b.length<100)break}repos=all.filter(r=>!r.fork);$("#status").textContent=`ONLINE · ${repos.length} public projects · newest first`;render()}catch(e){$("#status").textContent="Could not contact GitHub: "+e.message}}
$("#q").oninput=render;$("#refresh").onclick=load;$("#close").onclick=()=>$("#explorer").classList.remove("on");load();
</script></body></html>
