<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>razaci projects</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0d1117;color:#e6edf3;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
  main{width:min(900px,94%);margin:32px auto}
  header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
  h1{font-size:24px;margin:0;margin-right:auto}
  button,input{border:1px solid #30363d;background:#161b22;color:#e6edf3;border-radius:8px;padding:10px 12px}
  button{cursor:pointer}
  button:hover{background:#21262d}
  input{min-width:220px}
  #status{color:#8b949e;margin:8px 0 16px}
  #list{display:grid;gap:8px}
  .project{display:flex;align-items:center;gap:12px;padding:13px 14px;background:#161b22;border:1px solid #30363d;border-radius:9px}
  .folder{font-size:20px}
  .name{font-weight:700;overflow-wrap:anywhere}
  .actions{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
  a{color:#58a6ff;text-decoration:none;border:1px solid #30363d;padding:7px 9px;border-radius:7px}
  a:hover{background:#21262d}
  @media(max-width:600px){
    main{margin:18px auto}
    .project{align-items:flex-start;flex-wrap:wrap}
    .actions{width:100%;margin-left:32px}
    input{width:100%}
  }
</style>
</head>
<body>
<main>
<header>
  <h1>razaci projects</h1>
  <button id="reload">Reload</button>
  <input id="search" placeholder="Find a project…">
</header>
<div id="status">Loading projects…</div>
<div id="list"></div>
</main>

<script>
const USER = "razaci";
const PAGES_REPO = "razaci.github.io";
let projects = [];

async function loadProjects(){
  const status = document.getElementById("status");
  status.textContent = "Loading projects…";
  try{
    // GitHub's repository API is paginated, so fetch every page.
    let page = 1, repos = [];
    while(true){
      const url = `https://api.github.com/users/${USER}/repos?per_page=100&page=${page}&sort=updated`;
      const res = await fetch(url, {headers:{Accept:"application/vnd.github+json"}});
      if(!res.ok) throw new Error(`GitHub returned ${res.status}`);
      const batch = await res.json();
      repos.push(...batch);
      if(batch.length < 100) break;
      page++;
    }

    projects = repos
      .filter(r => !r.fork && r.name !== PAGES_REPO)
      .sort((a,b) => new Date(b.updated_at) - new Date(a.updated_at));

    render();
  }catch(err){
    status.textContent = "Could not load GitHub projects. " + err.message;
  }
}

function render(){
  const q = document.getElementById("search").value.trim().toLowerCase();
  const list = document.getElementById("list");
  const shown = projects.filter(p => p.name.toLowerCase().includes(q));
  document.getElementById("status").textContent =
    `${shown.length} project${shown.length===1?"":"s"}${q?" found":""}`;

  list.innerHTML = shown.map(p => {
    const play = `https://${USER}.github.io/${encodeURIComponent(p.name)}/`;
    const repo = p.html_url;
    return `<div class="project">
      <span class="folder">📁</span>
      <span class="name">${escapeHTML(p.name)}</span>
      <span class="actions">
        <a href="${play}" target="_blank" rel="noopener">Play</a>
        <a href="${repo}" target="_blank" rel="noopener">GitHub</a>
      </span>
    </div>`;
  }).join("");
}

function escapeHTML(s){
  return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

document.getElementById("reload").onclick = loadProjects;
document.getElementById("search").oninput = render;
loadProjects();
</script>
</body>
</html>
